# Test profile. Fixed, obviously fake values so tests never depend on the environment.
# LoggingEmailService is active under this profile, so no mail is sent.
app:
  api:
    base-url: https://api.example.com
  cors:
    allowed-origins: http://localhost:3000
  security:
    ip-salt: test-ip-salt-value
    admin-token: test-admin-token-0123456789abcdef
  turnstile:
    # Cloudflare's documented "always passes" test secret key.
    secret-key: 1x0000000000000000000000000000000AA
  mail:
    resend-api-key: test-resend-api-key
    from: portfolio@example.com
    owner-email: owner@example.com
  github:
    # GithubClient is mocked in every test, and GithubRefreshScheduler is inactive under this
    # profile, so nothing ever authenticates with this.
    token: test-github-token
    username: test-user
  status:
    # Empty on purpose. The scheduler is inactive under this profile anyway, and the integration
    # test for the unconfigured case asserts on exactly this: an empty list is a working
    # configuration, not a startup failure.
    services: []
  chat:
    # Same shape as production, with timings a test can wait out. The threshold is 0 because
    # the stub EmbeddingModel's vectors are arbitrary: what the retrieval tests assert is the
    # plumbing (topK, dedup by url, the empty case), not Gemini's similarity scores.
    top-k: 5
    similarity-threshold: 0.0
    max-context-chars: 8000
    # Short enough that the "primary never answers" test does not stall the suite.
    first-token-timeout: 200ms
    system-prompt-resource: classpath:prompts/system.st
    knowledge-location: classpath:knowledge-test/*.md
    max-messages: 10
    # Nothing is embedded at startup. KnowledgeIngestionServiceTest drives ingestion by hand,
    # so each test controls exactly which fixtures exist when it runs.
    ingest-on-startup: false

spring:
  # The google-genai *connection* auto-configurations are not gated by spring.ai.model.*: they
  # build their connection details from whatever credentials are present, and throw when there
  # are none. Setting a fake key would silence them, but excluding them outright is the honest
  # version -- it leaves nothing in the test context that holds a credential or knows a provider
  # endpoint, so "no test can reach an LLM" is enforced by the wiring and not by a placeholder.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
  ai:
    # No provider model auto-configuration at all, for the same reason: with every selector set
    # to `none` there is no Gemini client and no OpenAI client in the context to call.
    # StubAiConfig supplies beans under the same names the auto-configurations would have used.
    model:
      chat: none
      embedding: none
      embedding.text: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    chat:
      client:
        enabled: false
    vectorstore:
      pgvector:
        # Identical to production: the integration tests run the real PgVectorStore against
        # the pgvector container, over the schema V5__knowledge.sql creates.
        initialize-schema: false
        dimensions: 768
        index-type: hnsw
        distance-type: cosine_distance
        table-name: vector_store
