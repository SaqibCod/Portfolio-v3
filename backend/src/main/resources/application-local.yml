# Local development profile: run with -Dspring-boot.run.profiles=local
# Values come from the environment; the defaults match docker-compose.yml, so this profile
# starts with no configuration at all.
spring:
  config:
    # Load backend/.env if it exists. Spring Boot has no built-in .env support, so without this
    # the file is ignored; the [.properties] hint is required because .env has no extension.
    # Optional and local-only on purpose: a stray .env must never mask a missing variable in a
    # deployed environment. Resolved against the working directory, so run Maven from backend/.
    import: "optional:file:./.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USERNAME:portfolio}
    password: ${DB_PASSWORD:portfolio}

app:
  # app.api.base-url is inherited from application.yml on purpose: problem `type` URIs stay
  # identical in every environment, so a client can match on them regardless of where it points.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    ip-salt: ${IP_HASH_SALT:local-development-ip-salt}
    admin-token: ${ADMIN_TOKEN:local-development-admin-token-not-a-secret}
  turnstile:
    # Cloudflare's documented "always passes" test secret key. Set TURNSTILE_SECRET_KEY to
    # 2x0000000000000000000000000000000AA to exercise the 422 rejection path instead.
    secret-key: ${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
  mail:
    # LoggingEmailService is active under this profile, so nothing is actually sent.
    resend-api-key: ${RESEND_API_KEY:local-development-resend-key}
    from: ${MAIL_FROM:portfolio@example.com}
    owner-email: ${OWNER_EMAIL:owner@example.com}
  github:
    # There is no usable placeholder here: GitHub's GraphQL API rejects any token that is not
    # real, so /api/v1/github/* answers 503 until GITHUB_TOKEN is a token this account owns.
    # Create one at https://github.com/settings/personal-access-tokens with public read access.
    token: ${GITHUB_TOKEN:local-development-github-token}
    username: ${GITHUB_USERNAME:SaqibCod}
