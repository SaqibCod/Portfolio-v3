spring:
  application:
    name: portfolio
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

# Application settings. Every value comes from the environment so that no secret
# is ever committed; AppProperties validates them at startup.
app:
  api:
    # Public base URL of this API. Also the base of every problem `type` URI
    # (<base-url>/problems/<slug>), so changing it changes identifiers clients match on.
    base-url: ${API_BASE_URL:https://api.example.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    ip-salt: ${IP_HASH_SALT}
    admin-token: ${ADMIN_TOKEN}
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY}
  mail:
    resend-api-key: ${RESEND_API_KEY}
    from: ${MAIL_FROM}
    owner-email: ${OWNER_EMAIL}
